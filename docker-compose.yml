services:
  postgres:
    image: postgres:16-alpine
    container_name: stockeasy-postgres
    environment:
      POSTGRES_DB: stockeasy
      POSTGRES_USER: stockeasy
      POSTGRES_PASSWORD: stockeasy123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockeasy -d stockeasy"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: stockeasy-api
    container_name: stockeasy-api
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - DOTNET_USE_POLLING_FILE_WATCHER=1
      - ConnectionStrings__Postgres=Host=postgres;Database=stockeasy;Username=stockeasy;Password=stockeasy123
    volumes:
      - ./backend:/src
    working_dir: /src/Inventory
    command: ["dotnet", "watch", "run", "--no-launch-profile", "--urls", "http://+:8080"]
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: stockeasy-web
    container_name: stockeasy-web
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    working_dir: /app
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    depends_on:
      - backend

volumes:
  postgres_data:
